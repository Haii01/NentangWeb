<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Fixed</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="d-flex">

        <!-- ================= SIDEBAR ================= -->
        <div class="bg-dark text-white vh-100 p-3 position-fixed" style="width:240px;">

            <h5 class="text-center mb-4">ADMIN</h5>

            <a class="d-block text-white text-decoration-none py-2" href="#">Dashboard</a>
            <a class="d-block text-white text-decoration-none py-2" href="#">Orders</a>
            <a class="d-block text-white text-decoration-none py-2" href="#">Products</a>
            <a class="d-block text-white text-decoration-none py-2" href="#">Users</a>

        </div>

        <!-- ================= MAIN ================= -->
        <div class="flex-grow-1" style="margin-left:240px;">

            <!-- TOPBAR -->
            <nav class="navbar bg-white border-bottom px-3">

                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Dashboard</li>
                </ol>

                <div class="dropdown">
                    <button class="btn btn-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          User
        </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                    </ul>
                </div>

            </nav>

            <!-- ALERT -->
            <div class="container mt-3">
                <div class="alert alert-success">
                    Login successful
                </div>
            </div>

            <!-- STATS -->
            <div class="container mt-3">
                <div class="row g-3">

                    <div class="col-md-3 col-6">
                        <div class="card bg-primary text-white p-3">
                            Users
                            <h4>1200</h4>
                        </div>
                    </div>

                    <div class="col-md-3 col-6">
                        <div class="card bg-success text-white p-3">
                            Orders
                            <h4>340</h4>
                        </div>
                    </div>

                    <div class="col-md-3 col-6">
                        <div class="card bg-warning text-white p-3">
                            Revenue
                            <h4>$9K</h4>
                        </div>
                    </div>

                    <div class="col-md-3 col-6">
                        <div class="card bg-danger text-white p-3">
                            Errors
                            <h4>2</h4>
                        </div>
                    </div>

                </div>
            </div>

            <!-- TABLE -->
            <div class="container mt-4">

                <table class="table table-striped table-hover bg-white">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Product</th>
                            <th>Status</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>An</td>
                            <td>iPhone</td>
                            <td><span class="badge bg-success">Done</span></td>
                            <td>25M</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Binh</td>
                            <td>MacBook</td>
                            <td><span class="badge bg-warning">Pending</span></td>
                            <td>45M</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <!-- FILTER -->
            <div class="container mt-4">

                <div class="input-group">
                    <input class="form-control" placeholder="Search...">

                    <select class="form-select">
          <option>All</option>
          <option>Done</option>
          <option>Pending</option>
        </select>

                    <button class="btn btn-primary">Search</button>
                </div>

            </div>

            <!-- ACCORDION -->
            <div class="container mt-5">

                <div class="accordion" id="faq">

                    <div class="accordion-item">

                        <h2 class="accordion-header">
                            <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#q1">
              What is dashboard?
            </button>
                        </h2>

                        <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faq">
                            <div class="accordion-body">
                                Admin dashboard system
                            </div>
                        </div>

                    </div>

                    <div class="accordion-item mt-2">

                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#q2">
              Bootstrap?
            </button>
                        </h2>

                        <div id="q2" class="accordion-collapse collapse" data-bs-parent="#faq">
                            <div class="accordion-body">
                                CSS framework
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
