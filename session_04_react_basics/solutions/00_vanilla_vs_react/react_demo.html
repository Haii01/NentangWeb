<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Todo — React</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .todo-item.done span {
            text-decoration: line-through;
            color: #999;
        }
        
        .todo-item button {
            margin-left: auto;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        
        button.add-btn {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React; function TodoApp() { const [todos, setTodos] = useState([]); const [input, setInput] = useState(""); function addTodo() { // TODO 1 if (input.trim() === "") return; // TODO 2 const newTodo = { id: Date.now(), text: input, done:
        false, }; // TODO 3 setTodos((prev) => [...prev, newTodo]); // TODO 4 setInput(""); } function toggleTodo(id) { // TODO 5 setTodos((prev) => prev.map((todo) => (todo.id === id ? { ...todo, done: !todo.done } : todo))); } function deleteTodo(id)
        { // TODO 6 setTodos((prev) => prev.filter((todo) => todo.id !== id)); } return (
        <div>
            <h1>📋 Todo List</h1>

            <div>
                <input type="text" value={input} onChange={(e)=> setInput(e.target.value)} placeholder="Nhập công việc..." />

                <button className="add-btn" onClick={addTodo}>
                Thêm
              </button>
            </div>

            {/* TODO 7 */} {todos.map((todo) => (
            <div key={todo.id} className={`todo-item ${todo.done ? "done" : ""}`}>
                <span>{todo.text}</span> {/* TODO 8 */}

                <button onClick={()=> toggleTodo(todo.id)}>{todo.done ? "Hoàn tác" : "Hoàn thành"}</button>

                <button onClick={()=> deleteTodo(todo.id)}>Xóa</button>
            </div>
            ))}
        </div>
        ); } const root = ReactDOM.createRoot(document.getElementById("root")); root.render(
        <TodoApp />);
    </script>
</body>

</html>
